<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t">
<title id="t">Korivash: self-taught systems developer. One VPS running Discord bots, WoW addons, web apps, games and an AI agent crew.</title>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b2431" stroke-width="1"/></pattern>
  <radialGradient id="vignette" cx="70%" cy="50%" r="75%"><stop offset="0" stop-color="#070a0f" stop-opacity="0"/><stop offset="1" stop-color="#070a0f" stop-opacity=".95"/></radialGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1280" height="320" rx="12" fill="#070a0f"/>
<rect width="1280" height="320" rx="12" fill="url(#grid)" opacity=".7"/>
<rect width="1280" height="320" rx="12" fill="url(#vignette)"/>
<rect x=".5" y=".5" width="1279" height="319" rx="12" fill="none" stroke="#1b2431"/>
<path d="M12 .5H1268" stroke="url(#brand)" stroke-width="2"/>

<!-- left: identity -->
<g font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">
  <text x="64" y="92" font-size="14" fill="#566173">~/korivash $ <tspan fill="#8b98a9">whoami</tspan></text>
  <text x="62" y="160" font-size="66" font-weight="800" fill="#e6edf3" letter-spacing="2">KORIVASH</text>
  <rect x="64" y="176" width="140" height="3" fill="url(#brand)"/>
  <text x="64" y="214" font-size="17" fill="#8b98a9">self-taught systems developer · shipping since 2016</text>
  <text x="64" y="244" font-size="17" fill="#8b98a9">I write it, deploy it and keep it running.</text>
  <text x="64" y="282" font-size="13" fill="#566173">TypeScript · Lua · Python · Node · MariaDB · Windows Server<tspan fill="#38bdf8"> ▍<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</g>

<!-- right: system map -->
<g font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="12.5">
  <!-- links -->
  <g stroke="#2a3646" stroke-width="1.3" fill="none">
    <path id="l1" d="M940 160 L800 78"/>
    <path id="l2" d="M940 160 L1080 78"/>
    <path id="l3" d="M940 160 L780 160"/>
    <path id="l4" d="M940 160 L1100 160"/>
    <path id="l5" d="M940 160 L800 242"/>
    <path id="l6" d="M940 160 L1080 242"/>
  </g>
  <!-- packets -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle r="3" fill="#2dd4bf"><animateMotion dur="2.9s" begin=".4s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
    <circle r="3" fill="#818cf8"><animateMotion dur="2.1s" begin=".9s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
    <circle r="3" fill="#2dd4bf"><animateMotion dur="3.1s" begin=".2s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
    <circle r="3" fill="#818cf8"><animateMotion dur="2.3s" begin="1.6s" repeatCount="indefinite"><mpath href="#l6"/></animateMotion></circle>
  </g>
  <!-- core -->
  <circle cx="940" cy="160" r="58" fill="url(#core)"/>
  <circle cx="940" cy="160" r="34" fill="#0c1118" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="940" cy="160" r="34" fill="none" stroke="#38bdf8" stroke-opacity=".5"><animate attributeName="r" values="34;54" dur="2.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" repeatCount="indefinite"/></circle>
  <text x="940" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3" letter-spacing="1">ONE</text>
  <text x="940" y="171" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">VPS</text>
  <!-- nodes -->
  <g>
    <rect x="712" y="62" width="128" height="30" rx="6" fill="#0c1118" stroke="#2a3646"/><circle cx="726" cy="77" r="4" fill="#34d399"/><text x="736" y="81" fill="#e6edf3">Discord bots</text>
    <rect x="1040" y="62" width="128" height="30" rx="6" fill="#0c1118" stroke="#2a3646"/><circle cx="1054" cy="77" r="4" fill="#34d399"/><text x="1064" y="81" fill="#e6edf3">WoW addons</text>
    <rect x="680" y="145" width="110" height="30" rx="6" fill="#0c1118" stroke="#2a3646"/><circle cx="694" cy="160" r="4" fill="#34d399"/><text x="704" y="164" fill="#e6edf3">Web apps</text>
    <rect x="1090" y="145" width="118" height="30" rx="6" fill="#0c1118" stroke="#2a3646"/><circle cx="1104" cy="160" r="4" fill="#34d399"/><text x="1114" y="164" fill="#e6edf3">AI agent crew</text>
    <rect x="712" y="227" width="128" height="30" rx="6" fill="#0c1118" stroke="#2a3646"/><circle cx="726" cy="242" r="4" fill="#34d399"/><text x="736" y="246" fill="#e6edf3">Games (Steam)</text>
    <rect x="1040" y="227" width="138" height="30" rx="6" fill="#0c1118" stroke="#2a3646"/><circle cx="1054" cy="242" r="4" fill="#34d399"/><text x="1064" y="246" fill="#e6edf3">Render pipeline</text>
  </g>
  <g fill="#34d399">
    <animate attributeName="opacity" values="1;.4;1" dur="2.2s" repeatCount="indefinite"/>
  </g>
</g>
</svg>
